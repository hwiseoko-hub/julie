<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구름 테트리스 (Cloud Tetris)</title>
  <meta name="description" content="맑은 하늘과 몽글몽글 구름 블록으로 즐기는 힐링 테트리스">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated Background Clouds -->
  <div class="sky-clouds" aria-hidden="true">
    <div class="floating-cloud cloud-1"></div>
    <div class="floating-cloud cloud-2"></div>
    <div class="floating-cloud cloud-3"></div>
    <div class="floating-cloud cloud-4"></div>
    <div class="floating-cloud cloud-5"></div>
  </div>

  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <h1 class="game-title">☁️ 구름 테트리스</h1>
      <p class="game-subtitle">하늘빛 세상에서 즐기는 몽글몽글 테트리스</p>
    </header>

    <!-- Main Game Area -->
    <main class="game-main">
      <!-- Left / Side Info: Next Block & Controls -->
      <aside class="side-panel left-panel">
        <section class="panel-box next-box">
          <h2 class="panel-title">다음 구름</h2>
          <div class="canvas-wrap next-canvas-wrap">
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>
        </section>

        <section class="panel-box controls-guide-box">
          <h2 class="panel-title">조작 방법</h2>
          <ul class="guide-list">
            <li>
              <span class="key-badge">◀</span>
              <span class="key-badge">▶</span>
              <span class="guide-desc">좌 / 우 이동 (길게 누르면 연속)</span>
            </li>
            <li>
              <span class="key-badge">▼</span>
              <span class="guide-desc">소프트 드롭 (빠른 낙하)</span>
            </li>
            <li>
              <span class="key-badge">▲</span>
              <span class="guide-desc">90도 시계방향 회전</span>
            </li>
            <li>
              <span class="key-badge space-badge">Space</span>
              <span class="guide-desc">하드 드롭 (즉시 착지)</span>
            </li>
          </ul>
        </section>
      </aside>

      <!-- Center: Main Tetris Board -->
      <div class="board-wrapper">
        <div class="canvas-outer">
          <canvas id="tetris-canvas" width="300" height="600"></canvas>
          
          <!-- Pause Overlay -->
          <div id="pause-overlay" class="overlay hidden">
            <div class="overlay-card">
              <span class="overlay-icon">⛅</span>
              <h2 class="overlay-title">일시정지됨</h2>
              <p class="overlay-subtitle">잠시 구름 위에서 쉬어가는 중이에요.</p>
              <button id="resume-overlay-btn" class="btn btn-primary">계속하기</button>
            </div>
          </div>

          <!-- Game Over Overlay -->
          <div id="gameover-overlay" class="overlay hidden">
            <div class="overlay-card">
              <span class="overlay-icon">🌧️</span>
              <h2 class="overlay-title gameover-text">게임 오버</h2>
              <div class="final-score-wrap">
                <span class="final-score-label">최종 점수</span>
                <span id="final-score-val" class="final-score-number">0</span>
              </div>
              <button id="restart-overlay-btn" class="btn btn-accent">다시 시작</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right / Side Stats: Score, Level, Lines, Actions -->
      <aside class="side-panel right-panel">
        <section class="panel-box stat-box">
          <h2 class="panel-title">점수</h2>
          <div id="score-display" class="stat-value highlight-val">0</div>
        </section>

        <section class="panel-box stat-box">
          <h2 class="panel-title">레벨</h2>
          <div id="level-display" class="stat-value">1</div>
        </section>

        <section class="panel-box stat-box">
          <h2 class="panel-title">제거한 줄</h2>
          <div id="lines-display" class="stat-value">0</div>
        </section>

        <section class="action-buttons-box">
          <button id="pause-btn" class="btn btn-action" aria-label="게임 일시정지 또는 계속하기">일시정지</button>
          <button id="restart-btn" class="btn btn-action btn-danger" aria-label="게임 다시 시작">다시 시작</button>
        </section>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
